[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperscreen"
version = "1.0.2"
description = "Make your Windows monitor behave like paper for long coding/reading sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PaperScreen Team" }
]
keywords = [
    "windows",
    "eye-strain",
    "paper-screen",
    "e-ink",
    "color-matrix",
    "magnification-api",
    "ddc-ci",
    "circadian-rhythm",
    "20-20-20",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 8",
    "Operating System :: Microsoft :: Windows :: Windows 8.1",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = []

[project.scripts]
paperscreen = "paperscreen.cli:main"

[project.gui-scripts]
paperscreen-tray = "paperscreen.daemon:daemon_main"

[project.urls]
Homepage = "https://github.com/paperscreen/paperscreen"
Documentation = "https://github.com/paperscreen/paperscreen#readme"
