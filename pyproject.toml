[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperscreen"
version = "1.0.4"
description = "Hardware-grade paper-like display engine for Windows with session-bound color matrices and DDC/CI control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PaperScreen Team" }
]
keywords = [
    "windows",
    "eye-strain",
    "paper-screen",
    "e-ink",
    "color-matrix",
    "magnification-api",
    "ddc-ci",
    "circadian-rhythm",
    "20-20-20",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = []

[project.scripts]
paperscreen = "paperscreen.cli:main"

[project.gui-scripts]
paperscreen-tray = "paperscreen.daemon:daemon_main"

[project.urls]
Homepage = "https://github.com/Destroyer-official/PaperScreen"
Documentation = "https://github.com/Destroyer-official/PaperScreen#readme"

[tool.pytest.ini_options]
pythonpath = ["."]
