name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Set up Python 3.11
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Run test suite
      run: |
        python -m unittest discover -s tests

    - name: Build standalone executable
      run: |
        python build_exe.py

    - name: Generate and Verify SHA-256 Checksum
      run: |
        $hash = Get-FileHash dist/PaperScreen/PaperScreen.exe -Algorithm SHA256
        $hash.Hash | Out-File -FilePath dist/PaperScreen/SHA256SUMS.txt -Encoding ascii
        Get-Content dist/PaperScreen/SHA256SUMS.txt
        # Verification check
        $verify = (Get-Content dist/PaperScreen/SHA256SUMS.txt).Trim()
        if ($verify -ne $hash.Hash) { throw "Checksum verification mismatch" }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@c062e08bd532870e20bd73abea3360c8502da14d # v2.0.8
      with:
        files: |
          dist/PaperScreen/PaperScreen.exe
          dist/PaperScreen/SHA256SUMS.txt
        draft: false
        prerelease: false
        generate_release_notes: true
