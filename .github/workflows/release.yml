name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Set up Python 3.11
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pytest

    - name: Run test suite
      run: |
        pytest -v

    - name: Build standalone executable
      run: |
        python build_exe.py

    - name: Generate and Verify SHA-256 Checksum
      run: |
        $exe = if (Test-Path dist/PaperScreen.exe) { "dist/PaperScreen.exe" } else { "dist/PaperScreen/PaperScreen.exe" }
        $hash = Get-FileHash $exe -Algorithm SHA256
        "$($hash.Hash.ToLower())  PaperScreen.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
        Get-Content dist/SHA256SUMS.txt
        # Verification check
        $line = (Get-Content dist/SHA256SUMS.txt).Trim()
        if (-not $line.StartsWith($hash.Hash.ToLower())) { throw "Checksum verification mismatch" }

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/PaperScreen.exe
          dist/SHA256SUMS.txt
        draft: false
        prerelease: false
        generate_release_notes: true
